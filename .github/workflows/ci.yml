# The drift guard this repository is built around.
#
# src/samples/payloads.json is generated in the backend repository and copied here, and the
# shape layer, the parity test and the generator all exist so that a trigger change which
# alters a payload shows up as a diff in that file. None of that is worth anything if the
# copied file lands without the suite running over it — a renamed payload key blanks every
# user mapping that reads it, silently, in a live Zap.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # tsconfig.json excludes test/, so this is the only pass that typechecks the tests.
      - run: npm run typecheck

      - run: npm test

      # Builds first: validate reads dist/, so a validate on its own can pass against a
      # stale build of the previous commit.
      - run: npm run validate
